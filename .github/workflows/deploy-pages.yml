name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Build with Supabase Auth
        run: npm run build
        env:
          # Public browser configuration, not administrative credentials.
          VITE_SUPABASE_URL: https://ajmujnobyfrjretsiumd.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_3KyPUfNfZk5v07Tx0AUj1Q_SK3RAvGQ
          VITE_AUTH_GOOGLE_ENABLED: 'false'
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
